name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404

    env:
      MISE_ENV: ci
      MISE_JOBS: "1"
      MISE_ENABLE_TOOLS: uv

    steps:
      - uses: actions/checkout@v6

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          cache_key_prefix: mise-v1-tools-uv

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Lint
        run: mise run lint

      - name: Check rules doc is up to date
        run: mise run check-rules-doc

      - name: Test
        run: mise run test
