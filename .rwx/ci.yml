on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}

  github:
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}

    push:
      if: ${{ event.git.branch == 'main' }}
      init:
        commit-sha: ${{ event.git.sha }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/amfaro/jarify.git
      ref: ${{ init.commit-sha }}
      # check-rules-doc compares the regenerated docs with git diff.
      preserve-git-dir: true

  - key: mise
    use: code
    call: gmatter/setup-mise 1.1.0
    filter:
      - mise.toml
    with:
      tools: uv

  - key: deps
    use: mise
    run: uv sync --frozen --all-groups

  - key: lint
    use: deps
    run: mise run lint

  - key: check-rules-doc
    use: deps
    run: mise run check-rules-doc

  - key: test
    use: deps
    run: mise run test

