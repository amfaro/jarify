# Proposes same-major RWX package updates for the top-level .rwx/*.yml
# definitions. Runs from main on a schedule; use "Run now" on the cron schedule
# in RWX Cloud for an on-demand run. Auto-merge stays off until main requires
# the RWX CI check.
on:
  cron:
    - key: update-rwx-packages
      schedule: '0 7 * * 1 America/New_York'
      init:
        commit-sha: ${{ event.git.sha }}

concurrency-pools:
  - id: amfaro/jarify:update-rwx-packages
    capacity: 1
    on-overflow: queue

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: update-rwx-packages
    call: rwx/update-packages-github 2.2.0
    with:
      repository: https://github.com/amfaro/jarify.git
      ref: ${{ init.commit-sha }}
      github-token: ${{ vaults.rwx-github-workflows.github-apps.amfaro-rwx-workflows-management.token }}
      allow-major-version-change: false
      enable-auto-merge: false
